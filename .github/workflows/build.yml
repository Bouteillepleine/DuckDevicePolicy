name: CI

on:
  push:
    branches: [ main, libxposed-102 ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # The release variant is the one users install, and it is the only one that runs R8,
      # resource shrinking and -adaptresourcefilecontents on the Xposed entry-point list. A
      # tag-only release workflow means a broken shrinker config first shows up as a published
      # module the framework cannot load.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DuckDevicePolicy-debug
          path: app/build/outputs/apk/debug/*.apk
